{% extends "base.html" %}
{% block title %}Acceso administrativo - DevCore Solutions{% endblock %}
{% block content %}
<section class="login">
  <h1>Acceso administrativo</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/admin/login">
    <label>Usuario
      <input type="text" name="username" autocomplete="username">
    </label>
    <label>Clave
      <input type="password" name="password" autocomplete="current-password">
    </label>
    <button type="submit">Entrar</button>
  </form>
  <p class="nota">DevCore Solutions &middot; Modulo de administracion (entorno de pruebas)</p>
</section>
{% endblock %}
