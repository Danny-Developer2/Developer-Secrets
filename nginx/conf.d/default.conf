# ============================================================
#  DevCore Solutions - edge server (DELIBERADAMENTE INSEGURO)
#  Laboratorio de entrenamiento. No usar como referencia para
#  una configuracion real.
# ============================================================

server {
    listen 80;
    server_name _;

    server_tokens on;

    root /var/www/files;

    # Filtra informacion del borde
    add_header X-DevCore-Edge        "nginx-edge-1" always;
    add_header X-DevCore-FileServer  "1"             always;

    # --------------------------------------------------------
    # Recon: estado del servidor
    # --------------------------------------------------------
    location = /server-status {
        stub_status on;
    }

    location = /nginx-status {
        stub_status on;
    }

    # --------------------------------------------------------
    # Rutas administrativas ficticias (referenciadas en robots.txt)
    # --------------------------------------------------------
    location = /admin {
        return 301 /admin/;
    }

    location = /admin/ {
        return 403 "DevCore Admin - acceso restringido (ficticio)";
    }

    # --------------------------------------------------------
    # Exposicion de archivos con directory listing
    # --------------------------------------------------------
    location /files/ {
        alias /var/www/files/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        charset utf-8;
    }

    location /backup/ {
        alias /var/www/files/backups/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    location /old/ {
        alias /var/www/files/old/;
        autoindex on;
    }

    # --------------------------------------------------------
    # Fugas "clasicas"
    # --------------------------------------------------------
    location = /robots.txt {
        alias /var/www/files/robots.txt;
        default_type text/plain;
    }

    location = /sitemap.xml {
        alias /var/www/files/sitemap.xml;
        default_type application/xml;
    }

    # El equipo de desarrollo dejo "colgado" el entorno en la raiz
    location = /.env {
        alias /var/www/files/config/.env.bak;
        default_type text/plain;
        add_header X-DevCore-Leak "dotenv" always;
    }

    # --------------------------------------------------------
    # Proxy a servicios internos
    # --------------------------------------------------------
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
